[project]
name = "pycaxias-store-api"
version = "0.1.0"
description = "API HTTP local da loja PyCaxias"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask>=3.0,<4.0",
    "pydantic>=2.7",
]

[project.scripts]
pycaxias-store-api = "pycaxias_store_api.__main__:main"

[tool.poetry]
packages = [{ include = "pycaxias_store_api", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"

# Espelho interno do PyPI. Fora da rede corporativa, remova este bloco para
# permitir que o Poetry resolva dependências diretamente no PyPI público.
[[tool.poetry.source]]
name = "meli"
url = "https://pypi.artifacts.furycloud.io/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
